[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inventory-ai-mvp"
version = "0.1.0"
description = "Deterministic inventory normalization, forecasting, and QA MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
inventory-ai = "inventory_ai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inventory_ai"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
