[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inventory-ai-mvp"
version = "0.1.0"
description = "Deterministic inventory normalization, forecasting, and QA MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
inventory-ai = "inventory_ai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inventory_ai"]

[tool.hatch.build.targets.wheel.force-include]
"catalog.json" = "inventory_ai/resources/catalog.json"
"dataset.json" = "inventory_ai/resources/dataset.json"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["inventory_ai", "solution"]

[tool.coverage.report]
fail_under = 97
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
